name: APK Derleyici

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Cek
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Gradle Kur ve Derle
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace

      - name: APK'yi Indirilebilir Yap
        uses: actions/upload-artifact@v4
        with:
          name: Asistan-APK
          path: app/build/outputs/apk/debug/*.apk
